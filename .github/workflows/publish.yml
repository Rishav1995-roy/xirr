name: Publish to pub.dev

# Pushing a tag like v0.0.2 publishes that version to pub.dev.
# Needs "Automated publishing" enabled on the package's pub.dev Admin page
# (repository Rishav1995-roy/xirr, tag pattern v{{version}}, push events).
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC token for pub.dev, no long-lived secret
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # setup-dart exchanges the GitHub OIDC token for a pub.dev token.
      - uses: dart-lang/setup-dart@2286a0c042b44434fe26d292bbce8d34f7ec662b # v1.8.2
      - run: dart pub get
      - run: dart pub publish --dry-run
      - run: dart pub publish --force
